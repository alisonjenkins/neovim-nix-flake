[package]
name = "streamsearch"
version = "0.1.0"
edition = "2021"
description = "Bounded-memory, multi-threaded byte-offset search for files larger than RAM"
license = "MIT"

[dependencies]
libc = "0.2"
memchr = "2"
pcre2 = "0.2"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
