name: Build and Cache Nix Flake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor, so single-user
      # Nix silently fell back to unsandboxed builds (long /tmp build paths broke
      # fzf-lua's server socket in perfanno.nvim's require check).
      - name: Allow unprivileged user namespaces for the Nix sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            sandbox = true
            sandbox-fallback = false
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1073741824
          purge: true
          purge-prefixes: cache-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@v17
        with:
          name: ajenkins-public
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only merged builds belong in the public cache
          skipPush: ${{ github.event_name != 'push' }}
      - uses: DeterminateSystems/flake-checker-action@main
      - uses: docker/setup-qemu-action@v4
      - name: Run `nix flake check`
        # Full logs of failed builds; the default 25 lines usually cut off the error
        run: nix flake check --log-lines 500
      - name: Run `nix build`
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix develop --command bash -c "nix-fast-build --cachix-cache ajenkins-public --skip-cached --no-nom --flake '.#packages'"
      - name: Run `nix build` (no cache push)
        if: github.event_name != 'push'
        run: nix develop --command bash -c "nix-fast-build --skip-cached --no-nom --flake '.#packages'"
      - name: Test Neovim starts
        run: nix run . -- --headless +q
      - name: Push to cache
        if: github.event_name == 'push'
        run: cachix push ajenkins-public $(nix path-info --all)
